name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-plan:
    name: Test Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validator: ${{ steps.scope.outputs.validator }}
      backend: ${{ steps.scope.outputs.backend }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      backend_contracts: ${{ steps.plan.outputs.backend_contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify test selection
        run: python3 -m unittest scripts/tests/test_ci_test_plan.py scripts/tests/test_ci_test_scope.py
      - name: Select validator and backend suites
        id: scope
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci_test_scope.py | tee "$RUNNER_TEMP/test-scope.json"
          cat "$RUNNER_TEMP/test-scope.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Select tests from the complete PR diff
        id: plan
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_plan.py plan --event "$CI_EVENT_NAME" \
            --base "$CI_BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/test-plan.json"
          cat "$RUNNER_TEMP/test-plan.json" >> "$GITHUB_STEP_SUMMARY"

  validator:
    name: Validator Rule Tests
    needs: [test-plan]
    if: ${{ needs.test-plan.outputs.validator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev pkg-config
      - name: Check field mappings and fuzzer logic
        run: |
          python3 crates/libs/validator/tools/check_rule_tests.py
          python3 -m unittest discover crates/libs/validator/tools/tests
          python3 -m unittest discover crates/libs/validator/fuzz/tests/unit
      - name: Run validator tests and require every rule to pass
        shell: bash
        run: |
          set -o pipefail
          cargo test -p validator --locked -- --color never | tee "$RUNNER_TEMP/validator-tests.log"
          python3 crates/libs/validator/tools/check_rule_tests.py --test-log "$RUNNER_TEMP/validator-tests.log"

  case-editor-audit:
    name: Case Editor Audit Plan
    needs: [test-plan]
    if: ${{ needs.test-plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend contract source
        uses: actions/checkout@v4
        with:
          repository: QVIS-safety/e2br3-frontend
          ref: ${{ (github.base_ref == 'dev' || github.ref_name == 'dev') && 'dev' || 'main' }}
          path: frontend/E2BR3-frontend
          token: ${{ secrets.FRONTEND_REPOSITORY_TOKEN || github.token }}

      - name: Test audit runner
        env:
          E2BR3_FRONTEND_ROOT: ${{ github.workspace }}/frontend/E2BR3-frontend
        run: python3 -m unittest scripts/tests/test_case_editor_input_fuzzer.py

      # Complete target coverage is checked from registry below. The API fuzzer's
      # historical descriptor set is not the canonical UI denominator.

  # ============================================
  # Job 0: Validate E2BR3 registry
  # ============================================
  registry:
    name: E2BR3 Registry
    needs: [test-plan]
    if: ${{ needs.test-plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend registry source
        uses: actions/checkout@v4
        with:
          repository: QVIS-safety/e2br3-frontend
          ref: ${{ (github.base_ref == 'dev' || github.ref_name == 'dev') && 'dev' || 'main' }}
          path: frontend/E2BR3-frontend
          token: ${{ secrets.FRONTEND_REPOSITORY_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/E2BR3-frontend/package-lock.json

      - name: Install frontend parser dependencies
        working-directory: frontend/E2BR3-frontend
        run: npm ci --ignore-scripts

      - name: Validate frontend contract consumers
        working-directory: frontend/E2BR3-frontend
        env:
          E2BR3_BACKEND_ROOT: ${{ github.workspace }}
        run: |
          npm run check:editor-contracts
          npm run test:editor-contracts -- \
            __tests__/input-contracts.test.ts __tests__/ui-binding/review-section.test.tsx \
            --json --outputFile="$RUNNER_TEMP/editor-contract-tests.json"
          npm test -- __tests__/case-editor/validation-state.test.ts __tests__/case-editor/loadValidationForAuthorities.test.ts __tests__/case-editor/CaseValidationProvider.test.tsx __tests__/case-form/case-editor-route-loading.test.tsx __tests__/validation/backendFieldBanners.test.ts __tests__/validation/collection-field-error.test.tsx __tests__/api/case-list-validation.test.ts --runInBand

      - name: Validate registry
        env:
          E2BR3_FRONTEND_ROOT: ${{ github.workspace }}/frontend/E2BR3-frontend
        run: |
          python3 -m unittest registry/tools/test_validate.py
          python3 -m unittest registry/tools/test_build_dictionary.py
          python3 -m unittest registry/tools/test_extract_frontend_fields.py
          python3 -m unittest registry/tools/test_generate_editor_contract_web_tests.py
          python3 -m unittest registry/tools/test_check_contract_test_results.py
          python3 registry/tools/generate_editor_contract_web_tests.py --check
          python3 registry/tools/validate.py
          python3 registry/tools/validate.py --strict-dictionary
          python3 registry/tools/validate.py --strict-presave-inventory
          python3 registry/tools/validate.py --strict-backend-inventory
          python3 registry/tools/validate.py --strict-frontend-inventory
          for page in CI RP SD LR SI DM NR AE LB DG DH N; do
            python3 registry/tools/validate.py --strict-editor-contract "$page"
          done
          python3 -m unittest registry/tools/test_build_ui_inventory.py
          python3 registry/tools/build_ui_inventory.py \
            --frontend-root "$E2BR3_FRONTEND_ROOT" \
            --execution-hints scripts/case-editor-audit/case-edit-persisted-field-inventory.json \
            --execution-ledger registry/execution-ledger.json \
            --out /tmp/canonical-ui-inventory.json --check
          python3 registry/tools/check_contract_test_results.py \
            --inventory /tmp/canonical-ui-inventory.json \
            --frontend-root "$E2BR3_FRONTEND_ROOT" \
            --frontend-results "$RUNNER_TEMP/editor-contract-tests.json"

      - name: Share verified canonical inventory with API tests
        uses: actions/upload-artifact@v7
        with:
          name: canonical-editor-inventory
          path: /tmp/canonical-ui-inventory.json
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Job 1: Check code formatting
  # ============================================
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ============================================
  # Job 2: Run Clippy linter
  # ============================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # XML fixture-backed tests are compiled by --all-targets.
      - name: Checkout XML validation assets
        uses: actions/checkout@v4
        with:
          ref: 698f907f3abe6a555594931ace82e9fbcb9c204d
          path: .ci/xml-assets
          sparse-checkout: |
            deploy/ec2/schemas
            docs/refs/instances

      - name: Prepare XML validation assets
        run: |
          mkdir -p docs/exporter
          cp -R .ci/xml-assets/deploy/ec2/schemas docs/exporter/schema
          cp -R .ci/xml-assets/docs/refs/instances docs/exporter/fda

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev pkg-config

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  # ============================================
  # Job 3: Run tests with PostgreSQL
  # ============================================
  test:
    name: Test
    needs: [registry, test-plan]
    if: ${{ needs.test-plan.outputs.backend == 'true' && (needs.test-plan.outputs.mode == 'full' || needs.test-plan.outputs.mode == 'targeted') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Spin up PostgreSQL for integration tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: dev_only_pwd
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        # Wait for PostgreSQL to be ready
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Download verified canonical inventory
        uses: actions/download-artifact@v8
        with:
          name: canonical-editor-inventory
          path: ${{ runner.temp }}/editor-contract

      # XML fixtures and schemas were intentionally removed from the release
      # tree, but the validation suites still exercise those canonical assets.
      - name: Checkout XML validation assets
        uses: actions/checkout@v4
        with:
          ref: 698f907f3abe6a555594931ace82e9fbcb9c204d
          path: .ci/xml-assets
          sparse-checkout: |
            deploy/ec2/schemas
            docs/refs/instances

      - name: Prepare XML validation assets
        run: |
          mkdir -p docs/exporter
          cp -R .ci/xml-assets/deploy/ec2/schemas docs/exporter/schema
          cp -R .ci/xml-assets/docs/refs/instances docs/exporter/fda

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-dev pkg-config

      - name: Initialize database schema
        env:
          PGPASSWORD: dev_only_pwd
          APP_DB_USER: app_user
        run: |
          psql -h localhost -U "${APP_DB_USER}" -d app_db -v ON_ERROR_STOP=1 \
            -v "app_db_user=${APP_DB_USER}" \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          sh scripts/db/list_init_sql.sh db 1 |
          while IFS= read -r f; do
            psql -h localhost -U "${APP_DB_USER}" -d app_db -v ON_ERROR_STOP=1 \
              -v "app_db_user=${APP_DB_USER}" -f "db/$f"
          done

      - name: Run lib-core tests
        if: ${{ needs.test-plan.outputs.mode == 'full' }}
        env:
          # Skip local dev DB bootstrap; CI already initializes the schema
          SKIP_DEV_INIT: "1"
          # Database connection (matches the service above)
          SERVICE_DB_URL: postgres://app_user:dev_only_pwd@localhost/app_db
          # Test-only keys (NOT for production)
          SERVICE_PWD_KEY: CKUGFOD9_2Qf6Pn3ZFRYgPYb8ht4vKqEG9PGMXTB7497bT0367DjoaD6ydFnEVaIRda0kKeBZVCT5Hb62m2sCA
          SERVICE_TOKEN_KEY: 9FoHBmkyxbgu_xFoQK7e0jz3RMNVJWgfvbVn712FBNH9LLaAWS3CS6Zpcg6RveiObvCUb6a2z-uAiLjhLh2igw
          SERVICE_TOKEN_DURATION_SEC: "1800"
          SERVICE_WEB_FOLDER: "web-folder/"
        run: scripts/test-isolated-db.sh -p lib-core -j1 -- --test-threads=1

      - name: Run remaining workspace tests
        if: ${{ needs.test-plan.outputs.mode == 'full' }}
        env:
          SKIP_DEV_INIT: "1"
          SERVICE_DB_URL: postgres://app_user:dev_only_pwd@localhost/app_db
          SERVICE_PWD_KEY: CKUGFOD9_2Qf6Pn3ZFRYgPYb8ht4vKqEG9PGMXTB7497bT0367DjoaD6ydFnEVaIRda0kKeBZVCT5Hb62m2sCA
          SERVICE_TOKEN_KEY: 9FoHBmkyxbgu_xFoQK7e0jz3RMNVJWgfvbVn712FBNH9LLaAWS3CS6Zpcg6RveiObvCUb6a2z-uAiLjhLh2igw
          SERVICE_TOKEN_DURATION_SEC: "1800"
          SERVICE_WEB_FOLDER: "web-folder/"
        shell: bash
        run: |
          set -o pipefail
          scripts/test-isolated-db.sh --workspace --exclude lib-core --exclude validator -- --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"

      - name: Run changed integration targets
        if: ${{ needs.test-plan.outputs.mode == 'targeted' }}
        env:
          SELECTED_TESTS: ${{ needs.test-plan.outputs.targets }}
          SERVICE_DB_URL: postgres://app_user:dev_only_pwd@localhost/app_db
          SERVICE_PWD_KEY: CKUGFOD9_2Qf6Pn3ZFRYgPYb8ht4vKqEG9PGMXTB7497bT0367DjoaD6ydFnEVaIRda0kKeBZVCT5Hb62m2sCA
          SERVICE_TOKEN_KEY: 9FoHBmkyxbgu_xFoQK7e0jz3RMNVJWgfvbVn712FBNH9LLaAWS3CS6Zpcg6RveiObvCUb6a2z-uAiLjhLh2igw
          SERVICE_TOKEN_DURATION_SEC: "1800"
          SERVICE_WEB_FOLDER: "web-folder/"
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci_test_plan.py run --targets "$SELECTED_TESTS" 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"

      - name: Require complete backend contract execution
        if: ${{ needs.test-plan.outputs.backend_contracts == 'true' }}
        run: |
          python3 registry/tools/check_contract_test_results.py \
            --inventory "$RUNNER_TEMP/editor-contract/canonical-ui-inventory.json" \
            --backend-log "$RUNNER_TEMP/workspace-tests.log"

  deploy-dev:
    name: Publish Dev Backend Image
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref_name == 'dev' &&
          needs.test-plan.result == 'success' &&
          (needs.test-plan.outputs.backend == 'false' || needs.test-plan.outputs.mode == 'full') &&
          needs.fmt.result == 'success' && needs.clippy.result == 'success' &&
          ((needs.test-plan.outputs.validator == 'true' && needs.validator.result == 'success') ||
           (needs.test-plan.outputs.validator == 'false' && needs.validator.result == 'skipped')) &&
          ((needs.test-plan.outputs.backend == 'true' && needs.registry.result == 'success' && needs.test.result == 'success' && needs['case-editor-audit'].result == 'success') ||
           (needs.test-plan.outputs.backend == 'false' && needs.registry.result == 'skipped' && needs.test.result == 'skipped' && needs['case-editor-audit'].result == 'skipped')) }}
    needs: [test-plan, case-editor-audit, registry, fmt, clippy, validator, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check database migration changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags origin "${BEFORE_SHA}"
          scripts/db/check_migration_changes.sh "${BEFORE_SHA}" "${GITHUB_SHA}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA image
        run: |
          IMAGE_REF="ghcr.io/qvis-safety/e2br3-web-server:${GITHUB_SHA}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_ENV}"
          docker buildx build --platform linux/amd64 --push \
            --cache-from type=gha,scope=dev-backend \
            --cache-to type=gha,mode=max,scope=dev-backend \
            --tag "${IMAGE_REF}" --tag ghcr.io/qvis-safety/e2br3-web-server:dev .
