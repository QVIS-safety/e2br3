services:
  app:
    image: ${IMAGE_REF:-ghcr.io/replace-me/e2br3-web-server:latest}
    container_name: e2br3-web-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVICE_BIND_ADDR: "0.0.0.0:8080"
      SERVICE_WEB_FOLDER: "/app/web-folder/"
      SERVICE_DB_URL: "${SERVICE_DB_URL}"
      SERVICE_DB_MAX_CONNECTIONS: "${SERVICE_DB_MAX_CONNECTIONS:?SERVICE_DB_MAX_CONNECTIONS must be configured}"
      SERVICE_MIGRATION_DB_URL: "${SERVICE_MIGRATION_DB_URL}"
      SERVICE_PWD_KEY: "${SERVICE_PWD_KEY}"
      SERVICE_TOKEN_KEY: "${SERVICE_TOKEN_KEY}"
      SERVICE_TOKEN_DURATION_SEC: "${SERVICE_TOKEN_DURATION_SEC:?SERVICE_TOKEN_DURATION_SEC must be configured}"
      E2BR3_APP_NAME: "${E2BR3_APP_NAME:?E2BR3_APP_NAME must be configured}"
      E2BR3_APP_SHORT_NAME: "${E2BR3_APP_SHORT_NAME:?E2BR3_APP_SHORT_NAME must be configured}"
      E2BR3_ENV: "${E2BR3_ENV:?E2BR3_ENV must be configured}"
      E2BR3_STRICT_SUBMISSION_CONFIG: "${E2BR3_STRICT_SUBMISSION_CONFIG:?E2BR3_STRICT_SUBMISSION_CONFIG must be configured}"
      E2BR3_PUBLIC_ORIGIN: "${E2BR3_PUBLIC_ORIGIN:?E2BR3_PUBLIC_ORIGIN must be configured}"
      E2BR3_COOKIE_SECURE: "${E2BR3_COOKIE_SECURE:?E2BR3_COOKIE_SECURE must be configured}"
      FDA_ESG_ENABLED: "${FDA_ESG_ENABLED:?FDA_ESG_ENABLED must be configured}"
      SUBMISSION_RECONCILE_ENABLED: "${SUBMISSION_RECONCILE_ENABLED:?SUBMISSION_RECONCILE_ENABLED must be configured}"
      AS2_SUBMITTER_URL:
      AS2_SUBMITTER_TOKEN:
      AS2_SUBMITTER_TIMEOUT_SECS:
      AS2_ACK_CALLBACK_URL:
      AS2_CALLBACK_TOKEN:
      FDA_ESG_BASE_URL:
      FDA_ESG_SUBMIT_PATH:
      FDA_ESG_TIMEOUT_SECS:
      FDA_ESG_BEARER_TOKEN:
      FDA_ESG_API_KEY:
      SUBMISSION_RECONCILE_INTERVAL_SECS:
      SUBMISSION_RECONCILE_LIMIT:
      SUBMISSION_RECONCILE_TOKEN:
      E2BR3_VALIDATOR_TOKEN: "${E2BR3_VALIDATOR_TOKEN}"
      E2BR3_XSD_PATH: "${E2BR3_XSD_PATH:-/app/schemas/multicacheschemas/MCCI_IN200100UV01.xsd}"
      E2BR3_EXPORT_VALIDATE: "${E2BR3_EXPORT_VALIDATE:?E2BR3_EXPORT_VALIDATE must be configured}"
      E2BR3_DEFAULT_MESSAGE_SENDER: "${E2BR3_DEFAULT_MESSAGE_SENDER:?E2BR3_DEFAULT_MESSAGE_SENDER must be configured}"
      E2BR3_DEFAULT_MESSAGE_RECEIVER_FDA: "${E2BR3_DEFAULT_MESSAGE_RECEIVER_FDA:?E2BR3_DEFAULT_MESSAGE_RECEIVER_FDA must be configured}"
      E2BR3_DEFAULT_MESSAGE_RECEIVER_ICH: "${E2BR3_DEFAULT_MESSAGE_RECEIVER_ICH:?E2BR3_DEFAULT_MESSAGE_RECEIVER_ICH must be configured}"
      E2BR3_DEFAULT_MESSAGE_RECEIVER_MFDS: "${E2BR3_DEFAULT_MESSAGE_RECEIVER_MFDS:?E2BR3_DEFAULT_MESSAGE_RECEIVER_MFDS must be configured}"
      RUST_LOG: "${RUST_LOG:-web_server=info,lib_core=info,lib_web=info}"
      SKIP_DEV_INIT: "1"
      SERVICE_BOOTSTRAP_ENABLED: "false"
    volumes:
      # If this is wrong/missing, you'll see:
      # "XSD parse error: Failed to locate the main schema resource at '/app/schemas/...'"
      - ${E2BR3_SCHEMAS_DIR:-./schemas}:/app/schemas:ro

  terminology-loader:
    image: ${IMAGE_REF:-ghcr.io/replace-me/e2br3-web-server:latest}
    profiles:
      - tools
    restart: "no"
    entrypoint: ["/app/terminology-loader"]
    environment:
      SERVICE_DB_URL: "${SERVICE_DB_URL}"
      SERVICE_DB_MAX_CONNECTIONS: "${SERVICE_DB_MAX_CONNECTIONS:?SERVICE_DB_MAX_CONNECTIONS must be configured}"
      SERVICE_PWD_KEY: "${SERVICE_PWD_KEY}"
      SERVICE_TOKEN_KEY: "${SERVICE_TOKEN_KEY}"
      RUST_LOG: "${RUST_LOG:-terminology_loader=info,lib_core=info}"
      SKIP_DEV_INIT: "1"
    volumes:
      - ${E2BR3_TERMINOLOGY_DIR:-/opt/e2br3/terminology}:/terminology:ro
